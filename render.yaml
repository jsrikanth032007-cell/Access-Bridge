services:
  # =========================================================================
  # AccessBridge Backend API (Node.js Web Service)
  # =========================================================================
  - type: web
    name: accessbridge-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://client-green-zeta.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGO_URI
        sync: false

  # =========================================================================
  # AccessBridge Frontend (Optional Static Site on Render)
  # =========================================================================
  - type: web
    name: accessbridge-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: accessbridge-backend
          property: host
